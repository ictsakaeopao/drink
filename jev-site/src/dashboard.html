<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEV Human Review</title>
<style>
  :root {
    --bg: #f5f8fb; --card: #fff; --ink: #14283a; --muted: #5e7385; --line: #dfe8ef;
    --brand: #087fce; --ok: #138a52; --warn: #b26a00; --bad: #c0362c; --chip: #eef4f9;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1620; --card: #16212d; --ink: #e3edf5; --muted: #93a7b8; --line: #263545;
      --brand: #4cb3f5; --ok: #3ecf8e; --warn: #f0a640; --bad: #ff6b5e; --chip: #1e2c3a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: Tahoma, "Noto Sans Thai", system-ui, sans-serif; background: var(--bg); color: var(--ink); line-height: 1.55; }
  header { position: sticky; top: 0; z-index: 2; background: var(--card); border-bottom: 1px solid var(--line); }
  .bar { max-width: 1180px; margin: 0 auto; padding: 12px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  h1 { font-size: 1.1rem; margin: 0; flex: 1; min-width: 180px; }
  h1 small { color: var(--muted); font-weight: 400; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  button { border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 700; cursor: pointer; background: var(--chip); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.ok { background: var(--ok); color: #fff; } button.bad { background: var(--bad); color: #fff; } button.pri { background: var(--brand); color: #fff; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  .alert { background: color-mix(in srgb, var(--warn) 14%, var(--card)); border: 1px solid var(--warn); border-radius: 10px; padding: 10px 14px; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
  .task { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .task.overdue { border-color: var(--warn); }
  .head { padding: 14px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
  .head h2 { font-size: 1.05rem; margin: 0; margin-right: auto; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: .82rem; white-space: nowrap; }
  .s-held_for_signoff { color: var(--warn); } .s-approved, .s-published { color: var(--ok); } .s-changes_requested, .s-failed { color: var(--bad); }
  .u-critical { color: var(--bad); font-weight: 700; } .u-high { color: var(--warn); font-weight: 700; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 340px; }
  .preview { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 420px; }
  .tabs { display: flex; gap: 4px; padding: 8px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  .tabs button { padding: 4px 10px; font-weight: 400; font-size: .85rem; }
  .tabs button[aria-selected="true"] { background: var(--brand); color: #fff; }
  iframe { flex: 1; width: 100%; border: 0; background: #fff; min-height: 380px; }
  .side { min-width: 0; padding: 14px 16px; display: grid; gap: 14px; align-content: start; }
  .side h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 6px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; font-size: .9rem; }
  dt { color: var(--muted); } dd { margin: 0; overflow-wrap: anywhere; }
  ul { margin: 0; padding-left: 18px; font-size: .88rem; }
  .issue-critical, .issue-high { color: var(--bad); }
  ol.hist { margin: 0; padding-left: 18px; font-size: .82rem; color: var(--muted); max-height: 180px; overflow: auto; }
  .actions { display: grid; gap: 8px; }
  .actions .row { display: flex; gap: 8px; flex-wrap: wrap; }
  textarea { width: 100%; min-height: 60px; resize: vertical; }
  .msg { font-size: .85rem; min-height: 1.2em; margin: 0; }
  .msg.err { color: var(--bad); }
  @media (max-width: 820px) {
    .body { grid-template-columns: minmax(0, 1fr); }
    .preview { border-right: 0; border-bottom: 1px solid var(--line); min-height: 320px; }
    iframe { min-height: 300px; }
  }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>JEV Human Review <small>· ลงชื่อก่อนเผยแพร่</small></h1>
    <label>ผู้ตรวจ <input id="reviewer" placeholder="ชื่อของคุณ" autocomplete="name"></label>
    <button id="refresh" type="button">รีเฟรช</button>
  </div>
</header>
<main id="main" aria-live="polite"><p class="empty">กำลังโหลด…</p></main>

<script>
const $ = (tag, props = {}, ...kids) => {
  const el = Object.assign(document.createElement(tag), props);
  for (const k of kids.flat()) if (k != null) el.append(k);
  return el;
};
const STATUS = { held_for_signoff: 'รอลงชื่อ', approved: 'อนุมัติแล้ว', changes_requested: 'ถูกตีกลับ', published: 'เผยแพร่แล้ว', failed: 'ล้มเหลว' };
const REASON = { ready: 'ตรวจผ่านครบ', low_confidence: 'ความมั่นใจต่ำกว่าเกต', max_hops: 'วนเกินกำหนด' };
const reviewer = document.getElementById('reviewer');
try { reviewer.value = localStorage.getItem('jev-reviewer') ?? ''; } catch {}
reviewer.addEventListener('change', () => { try { localStorage.setItem('jev-reviewer', reviewer.value); } catch {} });
const selected = {}; // หน้าที่เลือกพรีวิวต่องาน (คงไว้ข้ามการรีเฟรช)
let pending = false;

async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (!r.ok) throw new Error(data.error ?? r.statusText);
  return data;
}

function card(t) {
  const msg = $('p', { className: 'msg', role: 'status' });
  const act = async (btn, path, body) => {
    msg.className = 'msg'; msg.textContent = 'กำลังดำเนินการ…'; pending = true;
    btn.closest('.actions').querySelectorAll('button').forEach((b) => (b.disabled = true));
    try { const r = await api(path, body ?? {}); msg.textContent = `สำเร็จ: ${STATUS[r.status] ?? r.status}`; await load(); }
    catch (e) { msg.className = 'msg err'; msg.textContent = e.message; btn.closest('.actions').querySelectorAll('button').forEach((b) => (b.disabled = false)); }
    finally { pending = false; }
  };
  const needName = () => { if (!reviewer.value.trim()) { msg.className = 'msg err'; msg.textContent = 'กรอกชื่อผู้ตรวจที่แถบด้านบนก่อน'; reviewer.focus(); return true; } };

  // พรีวิว
  const page = selected[t.id] && t.pages.includes(selected[t.id]) ? selected[t.id] : t.pages[0];
  const frame = $('iframe', { title: `พรีวิว ${t.id}`, sandbox: 'allow-scripts', loading: 'lazy' });
  if (page) frame.src = `/preview/${t.id}/${encodeURIComponent(page)}?v=${t.hops}`;
  const tabs = $('div', { className: 'tabs', role: 'tablist' }, t.pages.map((p) => {
    const b = $('button', { type: 'button', textContent: p, role: 'tab' });
    b.setAttribute('aria-selected', String(p === page));
    b.onclick = () => { selected[t.id] = p; frame.src = `/preview/${t.id}/${encodeURIComponent(p)}?v=${t.hops}`;
      tabs.querySelectorAll('button').forEach((x) => x.setAttribute('aria-selected', String(x === b))); };
    return b;
  }));

  // ปุ่มตามสถานะ
  const note = $('textarea', { placeholder: 'บันทึก / เหตุผลที่ตีกลับ' });
  const actions = $('div', { className: 'actions' });
  if (t.status === 'held_for_signoff') {
    const ok = $('button', { className: 'ok', type: 'button', textContent: '✓ อนุมัติ' });
    const no = $('button', { className: 'bad', type: 'button', textContent: '✕ ตีกลับ' });
    ok.onclick = () => needName() || act(ok, `/api/tasks/${t.id}/sign`, { reviewer: reviewer.value, approve: true, note: note.value });
    no.onclick = () => needName() || (!note.value.trim() ? (msg.className = 'msg err', msg.textContent = 'ระบุเหตุผลที่ตีกลับ', note.focus())
      : act(no, `/api/tasks/${t.id}/sign`, { reviewer: reviewer.value, approve: false, note: note.value }));
    actions.append(note, $('div', { className: 'row' }, ok, no));
  } else if (t.status === 'approved') {
    const b = $('button', { className: 'pri', type: 'button', textContent: 'เผยแพร่' });
    b.onclick = () => act(b, `/api/tasks/${t.id}/publish`);
    actions.append($('div', { className: 'row' }, b));
  } else if (t.status === 'changes_requested') {
    const b = $('button', { className: 'pri', type: 'button', textContent: 'ส่งกลับเข้าวงจร (resume)' });
    b.onclick = () => act(b, `/api/tasks/${t.id}/resume`);
    actions.append($('div', { className: 'row' }, b));
  }
  actions.append(msg);

  const r = t.route ?? {};
  return $('article', { className: `task${t.overdue ? ' overdue' : ''}` },
    $('div', { className: 'head' },
      $('h2', { textContent: t.id }),
      $('span', { className: `chip s-${t.status}`, textContent: STATUS[t.status] ?? t.status }),
      t.hold_reason && t.status === 'held_for_signoff' ? $('span', { className: 'chip', textContent: REASON[t.hold_reason] ?? t.hold_reason }) : null,
      t.overdue ? $('span', { className: 'chip u-high', textContent: `⚠ ค้าง ${t.held_minutes} นาที` }) : null),
    $('div', { className: 'body' },
      $('div', { className: 'preview' }, tabs, page ? frame : $('p', { className: 'empty', textContent: 'ยังไม่มีหน้าให้พรีวิว' })),
      $('div', { className: 'side' },
        actions,
        $('section', {}, $('h3', { textContent: 'การรูทล่าสุด' }), $('dl', {},
          $('dt', { textContent: 'intent' }), $('dd', { textContent: t.intent ?? '-' }),
          $('dt', { textContent: 'next_worker' }), $('dd', { textContent: r.next_worker ?? '-' }),
          $('dt', { textContent: 'urgency' }), $('dd', { className: `u-${r.urgency}`, textContent: r.urgency ?? '-' }),
          $('dt', { textContent: 'safe_to_run' }), $('dd', { textContent: r.safe_to_run ?? '-' }),
          $('dt', { textContent: 'confidence' }), $('dd', { textContent: r.confidence != null ? `${r.confidence} ${r.gate_passed ? '(ผ่านเกต)' : '(ต่ำกว่าเกต)'}` : '-' }),
          $('dt', { textContent: 'เหตุผล' }), $('dd', { textContent: r.reason ?? '-' }),
          $('dt', { textContent: 'hop / เวลา' }), $('dd', { textContent: `${t.hops ?? 0} hop · ${t.end_to_end_ms ?? '-'} ms` }))),
        $('section', {}, $('h3', { textContent: `ผลตรวจ (${t.issues.length})` }),
          t.issues.length ? $('ul', {}, t.issues.map((i) => $('li', { className: `issue-${i.severity}`, textContent: `[${i.severity}] ${i.file}: ${i.detail}` })))
            : $('p', { className: 'msg', textContent: 'ไม่พบปัญหา' })),
        t.signoff ? $('section', {}, $('h3', { textContent: 'การลงชื่อ' }),
          $('p', { className: 'msg', textContent: `${t.signoff.approve ? 'อนุมัติ' : 'ตีกลับ'} โดย ${t.signoff.reviewer} · ${new Date(t.signoff.at).toLocaleString('th-TH')}${t.signoff.note ? ` — ${t.signoff.note}` : ''}` })) : null,
        $('section', {}, $('h3', { textContent: 'ประวัติ' }), $('ol', { className: 'hist', reversed: true },
          t.history.slice(-30).reverse().map((h) => $('li', { textContent: `${new Date(h.at).toLocaleTimeString('th-TH')} ${h.step}${h.next_worker ? ` → ${h.next_worker}` : ''}${h.note ? `: ${h.note}` : ''}${h.reviewer ? ` (${h.reviewer})` : ''}${h.error ? ` ✕ ${h.error}` : ''}` })))))));
}

async function load() {
  const main = document.getElementById('main');
  try {
    const { tasks, window_minutes } = await api('/api/tasks');
    const late = tasks.filter((t) => t.overdue);
    main.replaceChildren(
      late.length ? $('div', { className: 'alert', role: 'alert', textContent: `⚠ มี ${late.length} draft ถูกกักเกินระยะตรวจ ${window_minutes} นาที: ${late.map((t) => t.id).join(', ')}` }) : '',
      ...(tasks.length ? tasks.map(card) : [$('p', { className: 'empty', textContent: 'ยังไม่มีงาน — รัน jev run <task.json> ก่อน' })]));
  } catch (e) {
    main.replaceChildren($('p', { className: 'empty', textContent: `โหลดไม่สำเร็จ: ${e.message}` }));
  }
}
document.getElementById('refresh').onclick = load;
// รีเฟรชอัตโนมัติ เว้นตอนผู้ใช้กำลังพิมพ์หรือกำลังส่งคำสั่ง
setInterval(() => { if (!pending && !document.activeElement?.matches('textarea, input')) load(); }, 15000);
load();
</script>
</body>
</html>
